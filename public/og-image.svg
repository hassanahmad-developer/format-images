<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111214"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1D1F22" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1D1F22" stroke-width="1"/>

  <!-- Border frame -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#303236" stroke-width="1.5"/>

  <!-- Logo mark -->
  <rect x="468" y="200" width="28" height="28" rx="4" fill="#14B8A6"/>
  <rect x="504" y="200" width="28" height="28" rx="4" fill="#14B8A6" opacity="0.5"/>
  <rect x="468" y="236" width="28" height="28" rx="4" fill="#14B8A6" opacity="0.5"/>
  <rect x="504" y="236" width="28" height="28" rx="4" fill="#14B8A6" opacity="0.25"/>

  <!-- Site name -->
  <text x="548" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="#F1F1F1" letter-spacing="-0.5">format-images</text>

  <!-- Divider -->
  <line x1="400" y1="290" x2="800" y2="290" stroke="#303236" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="400" fill="#71717A" text-anchor="middle">Convert &amp; remove backgrounds — free, private, in your browser.</text>

  <!-- Format pills -->
  <rect x="270" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="303" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">JPG</text>

  <rect x="348" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="381" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">PNG</text>

  <rect x="426" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="459" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">WEBP</text>

  <rect x="504" y="390" width="66" height="30" rx="5" fill="#14B8A6" stroke="#14B8A6" stroke-width="1"/>
  <text x="537" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">AVIF</text>

  <rect x="582" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="615" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">GIF</text>

  <rect x="660" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="693" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">BMP</text>

  <rect x="738" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="771" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">ICO</text>

  <rect x="816" y="390" width="66" height="30" rx="5" fill="#1D1F22" stroke="#303236" stroke-width="1"/>
  <text x="849" y="410" font-family="monospace" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">SVG</text>

  <!-- URL -->
  <text x="600" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#3F3F46" text-anchor="middle">format-images.vercel.app</text>
</svg>
